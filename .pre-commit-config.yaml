# Checks that run on `git commit`. Install once with: uv run pre-commit install
#
# The Python tools run as *local* hooks through `uv run`, so they use exactly the
# versions pinned in uv.lock: pre-commit, CI and your editor can never disagree.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format (also formats Python code blocks in Markdown)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, markdown]
        require_serial: true

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: import-linter (layer rules)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
