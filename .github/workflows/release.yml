name: Release

# Publishes to PyPI with trusted publishing (OIDC): no API token is stored anywhere.
# Runs only when a maintainer pushes a version tag such as v0.1.0.
# One-time setup before the first tag: on pypi.org add a trusted publisher for
# owner "evalhawk", repo "evalhawk", workflow "release.yml", environment "pypi",
# and create the "pypi" environment in GitHub with required reviewers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q -m "not slow"
      - name: Tag matches the package version
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
